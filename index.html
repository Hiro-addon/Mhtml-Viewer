<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MHTML Viewer</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#111;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
touch-action:none;
}

#app{
width:100%;
height:100%;
display:flex;
flex-direction:column;
}

#header{
height:60px;
min-height:60px;
display:flex;
align-items:center;
gap:6px;
padding:8px;
background:#17171b;
color:#fff;
z-index:100;
}

#title{
flex:1;
min-width:0;
font-size:16px;
font-weight:600;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

button{
height:42px;
min-width:42px;
padding:0 12px;
border:0;
border-radius:10px;
background:#303036;
color:#fff;
font-size:16px;
font-weight:600;
}

button:disabled{
opacity:.35;
}

#openButton{
background:#fff;
color:#111;
}

#fileInput{
position:absolute;
width:1px;
height:1px;
opacity:0;
}

#viewerArea{
position:relative;
flex:1;
overflow:hidden;
background:#fff;
}

#viewer{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
border:0;
background:#fff;
display:none;
transform-origin:0 0;
}

#status{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:90%;
text-align:center;
color:#777;
}

#status strong{
display:block;
font-size:22px;
color:#222;
margin-bottom:10px;
}

#status span{
font-size:14px;
}

#loading{
position:absolute;
inset:0;
display:none;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.65);
z-index:200;
color:#fff;
}

#loadingBox{
padding:20px 25px;
border-radius:14px;
background:#222;
text-align:center;
}

#spinner{
width:35px;
height:35px;
margin:0 auto 12px;
border:4px solid #555;
border-top-color:#fff;
border-radius:50%;
animation:spin .8s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

#zoomControls{
position:absolute;
right:12px;
bottom:12px;
display:none;
flex-direction:column;
gap:7px;
z-index:50;
}

#zoomControls button{
width:46px;
height:46px;
min-width:46px;
padding:0;
font-size:22px;
background:rgba(25,25,30,.92);
}

#zoomReset{
font-size:11px!important;
}

#navControls{
position:absolute;
left:12px;
bottom:12px;
display:none;
gap:7px;
z-index:50;
}

#navControls button{
width:46px;
min-width:46px;
padding:0;
background:rgba(25,25,30,.92);
}

#scale{
position:absolute;
left:50%;
bottom:17px;
transform:translateX(-50%);
display:none;
padding:7px 10px;
border-radius:9px;
background:rgba(25,25,30,.9);
color:#fff;
font-size:12px;
z-index:50;
pointer-events:none;
}

.error{
color:#d00!important;
}

body.fullscreen #header{
display:none;
}

body.fullscreen #viewerArea{
height:100%;
}

body.fullscreen #viewer{
height:100%;
}
</style>
</head>

<body>

<div id="app">

<div id="header">

<div id="title">
MHTML Viewer
</div>

<button id="backButton" disabled>‹</button>

<button id="forwardButton" disabled>›</button>

<button id="openButton">
MHTMLを選択
</button>

<button id="fullscreenButton">
⛶
</button>

<input
id="fileInput"
type="file"
accept=".mhtml,.mht"
>

</div>

<div id="viewerArea">

<div id="status">
<strong>MHTML Viewer</strong>
<span>MHTML / MHTファイルを選択してください</span>
</div>

<iframe
id="viewer"
title="MHTML Viewer"
></iframe>

<div id="zoomControls">

<button id="zoomIn">＋</button>

<button id="zoomReset">100%</button>

<button id="zoomOut">−</button>

</div>

<div id="navControls">

<button id="pageBack">←</button>

<button id="pageForward">→</button>

</div>

<div id="scale">
100%
</div>

<div id="loading">

<div id="loadingBox">

<div id="spinner"></div>

<div id="loadingText">
読み込んでいます…
</div>

</div>

</div>

</div>

</div>

<script>

const fileInput=document.getElementById("fileInput");
const openButton=document.getElementById("openButton");
const viewer=document.getElementById("viewer");
const viewerArea=document.getElementById("viewerArea");
const status=document.getElementById("status");
const title=document.getElementById("title");

const loading=document.getElementById("loading");
const loadingText=document.getElementById("loadingText");

const backButton=document.getElementById("backButton");
const forwardButton=document.getElementById("forwardButton");

const pageBack=document.getElementById("pageBack");
const pageForward=document.getElementById("pageForward");

const zoomControls=document.getElementById("zoomControls");
const zoomIn=document.getElementById("zoomIn");
const zoomOut=document.getElementById("zoomOut");
const zoomReset=document.getElementById("zoomReset");

const scaleText=document.getElementById("scale");

const fullscreenButton=document.getElementById("fullscreenButton");

let data=null;

let currentPage=0;

let history=[];
let historyIndex=-1;

let zoom=1;
let moveX=0;
let moveY=0;

let dragging=false;
let pointerId=null;

let startX=0;
let startY=0;

let startMoveX=0;
let startMoveY=0;


/* ファイル選択 */

openButton.addEventListener("click",function(){

fileInput.click();

});


fileInput.addEventListener("change",function(){

const file=fileInput.files[0];

if(!file){
return;
}

loadMHTML(file);

fileInput.value="";

});


async function loadMHTML(file){

try{

showLoading("MHTMLを解析しています…");

title.textContent=file.name;

const buffer=await file.arrayBuffer();

data=parseMHTML(buffer);

if(!data.pages.length){

throw new Error("MHTML内にHTMLページがありません");

}

currentPage=0;

history=[];
historyIndex=-1;

await displayPage(0,true);

status.style.display="none";

viewer.style.display="block";

zoomControls.style.display="flex";

navControls.style.display="flex";

scaleText.style.display="block";

hideLoading();

}catch(error){

console.error(error);

hideLoading();

viewer.style.display="none";

zoomControls.style.display="none";

navControls.style.display="none";

scaleText.style.display="none";

status.style.display="block";

status.innerHTML=
"<strong class=\"error\">読み込みに失敗しました</strong>"+
"<span>"+
escapeHTML(error.message||"不明なエラー")+
"</span>";

}

}


/* ページ表示 */

function displayPage(index,addHistory){

return new Promise(function(resolve,reject){

const page=data.pages[index];

if(!page){

reject(new Error("ページが見つかりません"));

return;

}

currentPage=index;

showLoading("ページを復元しています…");

const html=restoreHTML(
page.html,
data.resources,
page.location
);

viewer.onload=function(){

resetZoom();

installLinks();

if(addHistory){

history=history.slice(0,historyIndex+1);

history.push(index);

historyIndex=history.length-1;

}

updateNavigation();

hideLoading();

resolve();

};

viewer.onerror=function(){

reject(
new Error("ページの表示に失敗しました")
);

};

viewer.srcdoc=html;

});

}


/* MHTML内リンク */

function installLinks(){

try{

const doc=viewer.contentDocument;

if(!doc){
return;
}

const links=doc.querySelectorAll("a[href]");

links.forEach(function(link){

link.addEventListener("click",function(event){

const href=link.getAttribute("href");

if(!href){
return;
}

if(href.startsWith("#")){
return;
}

const absolute=resolveURL(
href,
data.pages[currentPage].location
);

const index=findPage(absolute);

if(index!==-1){

event.preventDefault();

displayPage(index,true);

}

});

});

}catch(error){

console.error(error);

}

}


/* 履歴 */

function goBack(){

if(historyIndex<=0){
return;
}

historyIndex--;

const index=history[historyIndex];

displayPage(index,false);

updateNavigation();

}


function goForward(){

if(historyIndex>=history.length-1){
return;
}

historyIndex++;

const index=history[historyIndex];

displayPage(index,false);

updateNavigation();

}


backButton.addEventListener("click",goBack);
forwardButton.addEventListener("click",goForward);

pageBack.addEventListener("click",goBack);
pageForward.addEventListener("click",goForward);


function updateNavigation(){

backButton.disabled=historyIndex<=0;

forwardButton.disabled=
historyIndex>=history.length-1;

pageBack.disabled=historyIndex<=0;

pageForward.disabled=
historyIndex>=history.length-1;

}


/* ズーム */

zoomIn.addEventListener("click",function(){

changeZoom(
zoom*1.25,
viewerArea.clientWidth/2,
viewerArea.clientHeight/2
);

});


zoomOut.addEventListener("click",function(){

changeZoom(
zoom*.8,
viewerArea.clientWidth/2,
viewerArea.clientHeight/2
);

});


zoomReset.addEventListener("click",function(){

resetZoom();

});


function changeZoom(newZoom,x,y){

newZoom=Math.max(
.25,
Math.min(6,newZoom)
);

const contentX=(x-moveX)/zoom;
const contentY=(y-moveY)/zoom;

zoom=newZoom;

moveX=x-contentX*zoom;
moveY=y-contentY*zoom;

applyTransform();

}


function resetZoom(){

zoom=1;

moveX=0;
moveY=0;

applyTransform();

}


function applyTransform(){

viewer.style.transform=
"translate3d("+
moveX+
"px,"+
moveY+
"px,0) scale("+
zoom+
")";

scaleText.textContent=
Math.round(zoom*100)+"%";

}


/* ドラッグ移動 */

viewerArea.addEventListener(
"pointerdown",
function(event){

if(zoom<=1){
return;
}

if(event.target.closest("button")){
return;
}

dragging=true;

pointerId=event.pointerId;

startX=event.clientX;
startY=event.clientY;

startMoveX=moveX;
startMoveY=moveY;

try{
viewerArea.setPointerCapture(pointerId);
}catch(error){}

},
{
passive:false
}
);


viewerArea.addEventListener(
"pointermove",
function(event){

if(!dragging){
return;
}

if(event.pointerId!==pointerId){
return;
}

event.preventDefault();

moveX=
startMoveX+
event.clientX-
startX;

moveY=
startMoveY+
event.clientY-
startY;

applyTransform();

},
{
passive:false
}
);


function endDrag(event){

if(
pointerId!==null &&
event.pointerId!==pointerId
){
return;
}

dragging=false;

try{

if(pointerId!==null){

viewerArea.releasePointerCapture(pointerId);

}

}catch(error){}

pointerId=null;

}


viewerArea.addEventListener(
"pointerup",
endDrag
);

viewerArea.addEventListener(
"pointercancel",
endDrag
);


/* 全画面 */

fullscreenButton.addEventListener(
"click",
async function(){

try{

if(document.fullscreenElement){

await document.exitFullscreen();

}else{

await document.documentElement.requestFullscreen();

}

}catch(error){

document.body.classList.toggle("fullscreen");

}

updateFullscreenButton();

});


document.addEventListener(
"fullscreenchange",
updateFullscreenButton
);


function updateFullscreenButton(){

if(document.fullscreenElement){

fullscreenButton.textContent="×";

}else{

fullscreenButton.textContent="⛶";

}

}


/* ローディング */

function showLoading(text){

loadingText.textContent=text;

loading.style.display="flex";

}


function hideLoading(){

loading.style.display="none";

}


/* MHTML解析 */

function parseMHTML(buffer){

const bytes=new Uint8Array(buffer);

const headerEnd=findHeaderEnd(bytes);

if(headerEnd<0){

throw new Error(
"MHTMLヘッダーが見つかりません"
);

}

const header=decodeText(
bytes.slice(0,headerEnd),
"utf-8"
);

const match=header.match(
/boundary\s*=\s*(?:"([^"]+)"|'([^']+)'|([^;\s]+))/i
);

if(!match){

throw new Error(
"MHTMLのboundaryが見つかりません"
);

}

const boundary=
match[1]||
match[2]||
match[3];

const bodyStart=
headerEnd+
separatorLength(bytes,headerEnd);

const parts=splitParts(
bytes.slice(bodyStart),
boundary
);

const resources=[];
const pages=[];

for(let i=0;i<parts.length;i++){

const part=parts[i];

const partHeaderEnd=findHeaderEnd(part);

if(partHeaderEnd<0){
continue;
}

const partHeader=decodeText(
part.slice(0,partHeaderEnd),
"utf-8"
);

const bodyStart2=
partHeaderEnd+
separatorLength(part,partHeaderEnd);

const headers=parseHeaders(partHeader);

const type=
getHeader(headers,"content-type");

const encoding=
getHeader(
headers,
"content-transfer-encoding"
).toLowerCase();

const location=
getHeader(
headers,
"content-location"
);

const contentId=
cleanContentId(
getHeader(
headers,
"content-id"
)
);

const encoded=part.slice(bodyStart2);

const decoded=decodeTransfer(
encoded,
encoding
);

resources.push({
type:type,
location:location,
contentId:contentId,
data:decoded
});

if(type.toLowerCase().includes("text/html")){

const charset=getCharset(type);

const html=decodeText(
decoded,
charset
);

pages.push({
html:html,
location:location,
contentId:contentId
});

}

}

return{
pages:pages,
resources:resources
};

}


/* HTML復元 */

function restoreHTML(
html,
resources,
pageLocation
){

const resourceMap=new Map();

resources.forEach(function(resource){

if(!resource.data.length){
return;
}

const mime=
resource.type.split(";")[0].trim()||
"application/octet-stream";

const blob=new Blob(
[resource.data],
{
type:mime
}
);

const url=URL.createObjectURL(blob);

if(resource.location){

resourceMap.set(
normalize(resource.location),
url
);

}

if(resource.contentId){

resourceMap.set(
"cid:"+normalize(resource.contentId),
url
);

}

});


function replaceURL(value){

if(!value){
return value;
}

value=value.trim();

if(
value.startsWith("data:")||
value.startsWith("blob:")||
value.startsWith("#")||
value.startsWith("javascript:")
){

return value;

}

if(value.startsWith("cid:")){

const cid=normalize(
value.substring(4)
);

if(resourceMap.has("cid:"+cid)){

return resourceMap.get("cid:"+cid);

}

}

if(resourceMap.has(normalize(value))){

return resourceMap.get(
normalize(value)
);

}

try{

const absolute=new URL(
value,
pageLocation||location.href
).href;

if(resourceMap.has(normalize(absolute))){

return resourceMap.get(
normalize(absolute)
);

}

}catch(error){}

return value;

}


html=html.replace(
/(\s(?:src|href|poster|background)\s*=\s*)(["'])(.*?)\2/gi,
function(match,prefix,quote,value){

return(
prefix+
quote+
replaceURL(value)+
quote
);

}
);


html=html.replace(
/url\(\s*(["']?)(.*?)\1\s*\)/gi,
function(match,quote,value){

return(
"url("+
quote+
replaceURL(value)+
quote+
")"
);

}
);


html=html.replace(
/<base\b[^>]*>/gi,
""
);

if(!/<meta[^>]+charset/i.test(html)){

html=
"<meta charset=\"UTF-8\">"+
html;

}

return html;

}


/* ページ検索 */

function findPage(url){

const target=normalize(url);

for(let i=0;i<data.pages.length;i++){

if(
normalize(data.pages[i].location)===
target
){

return i;

}

}

try{

const targetURL=new URL(url);

for(let i=0;i<data.pages.length;i++){

try{

const pageURL=new URL(
data.pages[i].location
);

if(pageURL.href===targetURL.href){

return i;

}

}catch(error){}

}

}catch(error){}

return -1;

}


/* URL */

function resolveURL(url,base){

try{

return new URL(
url,
base||location.href
).href;

}catch(error){

return url;

}

}


/* ヘッダー */

function parseHeaders(text){

text=text.replace(
/\r?\n[ \t]+/g,
" "
);

const result={};

const lines=text.split(/\r?\n/);

for(let i=0;i<lines.length;i++){

const line=lines[i];

const index=line.indexOf(":");

if(index<0){
continue;
}

const key=line
.substring(0,index)
.trim()
.toLowerCase();

const value=line
.substring(index+1)
.trim();

result[key]=value;

}

return result;

}


function getHeader(headers,name){

return headers[
name.toLowerCase()
]||"";

}


function getCharset(type){

const match=type.match(
/charset\s*=\s*(?:"([^"]+)"|([^;\s]+))/i
);

if(!match){
return "utf-8";
}

return(
match[1]||
match[2]||
"utf-8"
).trim();

}


function cleanContentId(value){

return String(value||"")
.replace(/^</,"")
.replace(/>$/,"")
.trim();

}


/* エンコード */

function decodeTransfer(bytes,encoding){

if(encoding.includes("base64")){

return decodeBase64(bytes);

}

if(
encoding.includes("quoted-printable")
){

return decodeQuotedPrintable(bytes);

}

return bytes;

}


function decodeBase64(bytes){

let text="";

for(let i=0;i<bytes.length;i++){

const c=bytes[i];

if(
c===9||
c===10||
c===13||
c===32
){

continue;

}

text+=String.fromCharCode(c);

}

try{

const binary=atob(text);

const result=new Uint8Array(
binary.length
);

for(let i=0;i<binary.length;i++){

result[i]=
binary.charCodeAt(i);

}

return result;

}catch(error){

return new Uint8Array();

}

}


function decodeQuotedPrintable(bytes){

const text=new TextDecoder(
"latin1"
).decode(bytes);

const result=[];

for(let i=0;i<text.length;i++){

if(text[i]==="="){

if(
text[i+1]==="\r"&&
text[i+2]==="\n"
){

i+=2;

continue;

}

if(text[i+1]==="\n"){

i++;

continue;

}

const hex=text.substring(
i+1,
i+3
);

if(/^[0-9a-fA-F]{2}$/.test(hex)){

result.push(
parseInt(hex,16)
);

i+=2;

continue;

}

}

result.push(
text.charCodeAt(i)&255
);

}

return new Uint8Array(result);

}


/* 文字コード */

function decodeText(bytes,charset){

charset=String(
charset||"utf-8"
)
.toLowerCase()
.trim();

const aliases={
utf8:"utf-8",
utf_8:"utf-8",
sjis:"shift-jis",
"shift_jis":"shift-jis",
"x-sjis":"shift-jis",
"euc_jp":"euc-jp"
};

charset=
aliases[charset]||
charset;

try{

return new TextDecoder(
charset
).decode(bytes);

}catch(error){

return new TextDecoder(
"utf-8"
).decode(bytes);

}

}


/* Multipart */

function findHeaderEnd(bytes){

for(
let i=0;
i<bytes.length-3;
i++
){

if(
bytes[i]===13&&
bytes[i+1]===10&&
bytes[i+2]===13&&
bytes[i+3]===10
){

return i;

}

}

for(
let i=0;
i<bytes.length-1;
i++
){

if(
bytes[i]===10&&
bytes[i+1]===10
){

return i;

}

}

return -1;

}


function separatorLength(bytes,pos){

if(
bytes[pos]===13&&
bytes[pos+1]===10&&
bytes[pos+2]===13&&
bytes[pos+3]===10
){

return 4;

}

return 2;

}


function splitParts(bytes,boundary){

const marker=
new TextEncoder().encode(
"--"+boundary
);

const positions=[];

let start=0;

while(true){

const position=indexOf(
bytes,
marker,
start
);

if(position<0){
break;
}

positions.push(position);

start=
position+
marker.length;

}

const parts=[];

for(
let i=1;
i<positions.length;
i++
){

let startPos=
positions[i-1]+
marker.length;

let endPos=
positions[i];

if(
bytes[startPos]===13&&
bytes[startPos+1]===10
){

startPos+=2;

}else if(
bytes[startPos]===10
){

startPos++;

}

if(
endPos>=2&&
bytes[endPos-2]===13&&
bytes[endPos-1]===10
){

endPos-=2;

}else if(
endPos>=1&&
bytes[endPos-1]===10
){

endPos--;

}

if(endPos>startPos){

parts.push(
bytes.slice(startPos,endPos)
);

}

}

return parts;

}


function indexOf(source,target,start){

outer:
for(
let i=start;
i<=source.length-target.length;
i++
){

for(
let j=0;
j<target.length;
j++
){

if(
source[i+j]!==target[j]
){

continue outer;

}

}

return i;

}

return -1;

}


/* その他 */

function normalize(value){

return String(value||"")
.trim()
.replace(
/^["']|["']$/g,
""
)
.replace(
/&amp;/gi,
"&"
);

}


function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#39;");

}

</script>

</body>
</html>
