<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MHTML Viewer</title>
<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#0d0d10;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{
overscroll-behavior:none;
}
#app{
width:100%;
height:100%;
display:flex;
flex-direction:column;
}
header{
height:62px;
flex-shrink:0;
display:flex;
align-items:center;
gap:7px;
padding:9px 10px;
background:#15151a;
border-bottom:1px solid #29292f;
z-index:20;
}
.title{
font-size:17px;
font-weight:700;
flex:1;
min-width:0;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
button{
border:0;
background:#29292f;
color:#fff;
border-radius:10px;
height:42px;
min-width:42px;
font-size:16px;
font-weight:600;
touch-action:manipulation;
}
button:disabled{
opacity:.35;
}
#openButton{
background:#fff;
color:#111;
padding:0 14px;
font-size:14px;
}
#fileInput{
display:none;
}
#viewerArea{
position:relative;
width:100%;
height:calc(100% - 62px);
overflow:hidden;
background:#fff;
}
#viewer{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
border:0;
background:#fff;
display:none;
transform-origin:0 0;
}
#status{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:90%;
max-width:500px;
text-align:center;
color:#aaa;
z-index:2;
}
#status strong{
display:block;
font-size:21px;
color:#fff;
margin-bottom:10px;
}
#status span{
font-size:14px;
line-height:1.7;
}
#loading{
display:none;
position:fixed;
inset:0;
z-index:100;
background:rgba(0,0,0,.72);
align-items:center;
justify-content:center;
flex-direction:column;
gap:14px;
}
.loader{
width:40px;
height:40px;
border:4px solid #555;
border-top-color:#fff;
border-radius:50%;
animation:spin .8s linear infinite;
}
@keyframes spin{
to{
transform:rotate(360deg);
}
}
#zoomControls{
position:absolute;
right:12px;
bottom:12px;
display:none;
flex-direction:column;
gap:7px;
z-index:30;
}
#zoomControls button{
width:46px;
height:46px;
min-width:46px;
font-size:21px;
background:rgba(25,25,30,.92);
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
}
#zoomReset{
font-size:12px!important;
}
#navControls{
position:absolute;
left:12px;
bottom:12px;
display:none;
gap:7px;
z-index:30;
}
#navControls button{
background:rgba(25,25,30,.92);
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
}
#scaleText{
position:absolute;
left:50%;
bottom:13px;
transform:translateX(-50%);
background:rgba(25,25,30,.85);
padding:8px 11px;
border-radius:9px;
font-size:12px;
z-index:30;
display:none;
pointer-events:none;
}
#fullscreenButton{
font-size:20px;
}
.error{
color:#ff6b6b!important;
}
body.fullscreen header{
display:none;
}
body.fullscreen #viewerArea{
height:100%;
}
</style>
</head>

<body>

<div id="app">

<header>

<div class="title" id="title">
MHTML Viewer
</div>

<button id="backButton" disabled>‹</button>

<button id="forwardButton" disabled>›</button>

<button id="openButton">
MHTMLを開く
</button>

<button id="fullscreenButton">
⛶
</button>

<input
id="fileInput"
type="file"
accept=".mhtml,.mht,message/rfc822"
>

</header>

<div id="viewerArea">

<div id="status">
<strong>MHTML Viewer</strong>
<span>
MHTML / MHTファイルを選択してください
</span>
</div>

<iframe
id="viewer"
title="MHTML Viewer"
></iframe>

<div id="zoomControls">

<button id="zoomIn">＋</button>

<button id="zoomReset">100%</button>

<button id="zoomOut">−</button>

</div>

<div id="navControls">

<button id="pageBack">←</button>

<button id="pageForward">→</button>

</div>

<div id="scaleText">
100%
</div>

</div>

</div>

<div id="loading">

<div class="loader"></div>

<div id="loadingText">
読み込んでいます…
</div>

</div>

<script>

const fileInput=document.getElementById("fileInput");
const openButton=document.getElementById("openButton");
const viewer=document.getElementById("viewer");
const viewerArea=document.getElementById("viewerArea");
const status=document.getElementById("status");
const title=document.getElementById("title");
const loading=document.getElementById("loading");
const loadingText=document.getElementById("loadingText");

const backButton=document.getElementById("backButton");
const forwardButton=document.getElementById("forwardButton");

const zoomControls=document.getElementById("zoomControls");
const zoomIn=document.getElementById("zoomIn");
const zoomOut=document.getElementById("zoomOut");
const zoomReset=document.getElementById("zoomReset");

const navControls=document.getElementById("navControls");
const pageBack=document.getElementById("pageBack");
const pageForward=document.getElementById("pageForward");

const scaleText=document.getElementById("scaleText");
const fullscreenButton=document.getElementById("fullscreenButton");


let mhtmlData=null;
let currentPage=0;

let pageHistory=[];
let historyIndex=-1;

let scale=1;
let offsetX=0;
let offsetY=0;

let dragging=false;
let dragPointerId=null;
let dragStartX=0;
let dragStartY=0;
let dragStartOffsetX=0;
let dragStartOffsetY=0;

let iframeDocument=null;


/* =========================
   ファイル選択
========================= */

openButton.addEventListener("click",function(){
fileInput.click();
});


fileInput.addEventListener("change",async function(){

const file=fileInput.files&&fileInput.files[0];

if(!file){
return;
}

try{

loading.style.display="flex";
loadingText.textContent="MHTMLを解析しています…";

title.textContent=file.name;

const buffer=await file.arrayBuffer();

mhtmlData=parseMHTML(buffer);

if(!mhtmlData.pages.length){

throw new Error("HTMLページが見つかりませんでした");

}

currentPage=0;
pageHistory=[];
historyIndex=-1;

await showPage(0,true);

status.style.display="none";
viewer.style.display="block";

zoomControls.style.display="flex";
navControls.style.display="flex";
scaleText.style.display="block";

updateNavigation();

loading.style.display="none";

}catch(error){

console.error(error);

loading.style.display="none";

viewer.style.display="none";
zoomControls.style.display="none";
navControls.style.display="none";
scaleText.style.display="none";

status.style.display="block";

status.innerHTML=
"<strong class=\"error\">読み込みに失敗しました</strong>"+
"<span>"+
escapeHTML(
error&&error.message
?error.message
:"MHTMLを読み込めませんでした"
)+
"</span>";

}

fileInput.value="";

});


/* =========================
   戻る・進む
========================= */

backButton.addEventListener("click",goBack);
forwardButton.addEventListener("click",goForward);

pageBack.addEventListener("click",goBack);
pageForward.addEventListener("click",goForward);


/* =========================
   ズーム
========================= */

zoomIn.addEventListener("click",function(){

zoomAt(
1.25,
viewerArea.clientWidth/2,
viewerArea.clientHeight/2
);

});


zoomOut.addEventListener("click",function(){

zoomAt(
0.8,
viewerArea.clientWidth/2,
viewerArea.clientHeight/2
);

});


zoomReset.addEventListener("click",function(){
resetView();
});


function zoomAt(factor,x,y){

const newScale=clamp(
scale*factor,
0.25,
6
);

setScaleAroundPoint(
newScale,
x,
y
);

}


function setScaleAroundPoint(newScale,x,y){

const contentX=(x-offsetX)/scale;
const contentY=(y-offsetY)/scale;

scale=newScale;

offsetX=x-contentX*scale;
offsetY=y-contentY*scale;

applyTransform();

}


function resetView(){

scale=1;
offsetX=0;
offsetY=0;

applyTransform();

}


function applyTransform(){

viewer.style.transform=
"translate3d("+
offsetX+
"px,"+
offsetY+
"px,0) scale("+
scale+
")";

scaleText.textContent=
Math.round(scale*100)+"%";

}


function clamp(value,min,max){

return Math.max(
min,
Math.min(max,value)
);

}


/* =========================
   ドラッグ
   ズーム時のみ
========================= */

viewerArea.addEventListener(
"pointerdown",
function(event){

if(scale<=1){
return;
}

if(event.target.closest("button")){
return;
}

dragging=true;
dragPointerId=event.pointerId;

dragStartX=event.clientX;
dragStartY=event.clientY;

dragStartOffsetX=offsetX;
dragStartOffsetY=offsetY;

try{
viewerArea.setPointerCapture(event.pointerId);
}catch{}

},
{
passive:false
}
);


viewerArea.addEventListener(
"pointermove",
function(event){

if(!dragging){
return;
}

if(event.pointerId!==dragPointerId){
return;
}

event.preventDefault();

offsetX=
dragStartOffsetX+
event.clientX-
dragStartX;

offsetY=
dragStartOffsetY+
event.clientY-
dragStartY;

applyTransform();

},
{
passive:false
}
);


function stopDragging(event){

if(
dragPointerId!==null&&
event.pointerId!==dragPointerId
){
return;
}

dragging=false;

try{

if(
dragPointerId!==null
){

viewerArea.releasePointerCapture(
dragPointerId
);

}

}catch{}

dragPointerId=null;

}


viewerArea.addEventListener(
"pointerup",
stopDragging
);

viewerArea.addEventListener(
"pointercancel",
stopDragging
);


/* =========================
   全画面
========================= */

fullscreenButton.addEventListener(
"click",
toggleFullscreen
);


async function toggleFullscreen(){

try{

if(document.fullscreenElement){

await document.exitFullscreen();

}else{

await document.documentElement.requestFullscreen();

}

}catch{

document.body.classList.toggle("fullscreen");

}

updateFullscreenButton();

}


document.addEventListener(
"fullscreenchange",
updateFullscreenButton
);


function updateFullscreenButton(){

if(document.fullscreenElement){

fullscreenButton.textContent="×";

}else{

fullscreenButton.textContent="⛶";

}

}


/* =========================
   ページ表示
========================= */

function showPage(index,addHistory){

return new Promise(function(resolve,reject){

if(
!mhtmlData||
!mhtmlData.pages||
!mhtmlData.pages[index]
){

resolve();

return;

}

currentPage=index;

const page=mhtmlData.pages[index];

loading.style.display="flex";
loadingText.textContent="ページを復元しています…";

const html=restoreResources(
page.html,
mhtmlData.resources,
page.location
);

let finished=false;

viewer.onload=function(){

if(finished){
return;
}

finished=true;

iframeDocument=viewer.contentDocument;

installLinks();

resetView();

if(addHistory){

pageHistory=
pageHistory.slice(
0,
historyIndex+1
);

pageHistory.push(index);

historyIndex=
pageHistory.length-1;

}

updateNavigation();

setTimeout(function(){

loading.style.display="none";

resolve();

},50);

};

viewer.onerror=function(){

if(finished){
return;
}

finished=true;

loading.style.display="none";

reject(
new Error("ページの読み込みに失敗しました")
);

};

viewer.srcdoc=html;

});

}


/* =========================
   MHTML内リンク
========================= */

function installLinks(){

if(!iframeDocument){
return;
}

const links=
iframeDocument.querySelectorAll("a[href]");

links.forEach(function(link){

link.addEventListener(
"click",
function(event){

const href=link.getAttribute("href");

if(!href){
return;
}

const target=resolveURL(
href,
mhtmlData.pages[currentPage].location
);

const pageIndex=findPageByURL(target);

if(pageIndex>=0){

event.preventDefault();

showPage(
pageIndex,
true
);

}

},
false
);

});

}


/* =========================
   履歴
========================= */

function goBack(){

if(historyIndex<=0){
return;
}

historyIndex--;

const index=
pageHistory[historyIndex];

showPage(
index,
false
);

updateNavigation();

}


function goForward(){

if(
historyIndex>=pageHistory.length-1
){
return;
}

historyIndex++;

const index=
pageHistory[historyIndex];

showPage(
index,
false
);

updateNavigation();

}


function updateNavigation(){

backButton.disabled=
historyIndex<=0;

forwardButton.disabled=
historyIndex>=pageHistory.length-1;

pageBack.disabled=
historyIndex<=0;

pageForward.disabled=
historyIndex>=pageHistory.length-1;

}


/* =========================
   ページ検索
========================= */

function findPageByURL(url){

if(!url){
return -1;
}

const normalized=normalizeURL(url);

for(
let i=0;
i<mhtmlData.pages.length;
i++
){

if(
normalizeURL(
mhtmlData.pages[i].location
)===normalized
){

return i;

}

}

try{

const target=new URL(url);

for(
let i=0;
i<mhtmlData.pages.length;
i++
){

try{

const pageURL=
new URL(
mhtmlData.pages[i].location
);

if(
pageURL.href===target.href
){

return i;

}

}catch{}

}

}catch{}

return -1;

}


/* =========================
   URL
========================= */

function resolveURL(url,base){

try{

return new URL(
url,
base||location.href
).href;

}catch{

return url;

}

}


/* =========================
   リソース復元
========================= */

function restoreResources(
html,
resources,
pageLocation
){

const map=new Map();

for(
const resource of resources
){

if(
!resource.data||
resource.data.length===0
){
continue;
}

const type=
resource.contentType
.split(";")[0]
.trim()||
"application/octet-stream";

const blob=new Blob(
[resource.data],
{
type:type
}
);

const blobURL=
URL.createObjectURL(blob);

if(resource.location){

addResourceMapping(
map,
resource.location,
blobURL
);

}

if(resource.contentId){

addResourceMapping(
map,
"cid:"+resource.contentId,
blobURL
);

addResourceMapping(
map,
"cid:<"+resource.contentId+">",
blobURL
);

}

}


const baseMatch=
html.match(
/<base[^>]+href\s*=\s*["']([^"']+)["']/i
);

const baseURL=
baseMatch?
baseMatch[1]:
pageLocation||"";


function replaceURL(value){

if(!value){
return value;
}

const original=value.trim();

if(
original.startsWith("data:")||
original.startsWith("blob:")||
original.startsWith("#")||
original.startsWith("javascript:")
){

return original;

}

const direct=
lookupResource(
map,
original
);

if(direct){
return direct;
}

try{

const absolute=
new URL(
original,
baseURL
).href;

const found=
lookupResource(
map,
absolute
);

if(found){
return found;
}

}catch{}

return original;

}


html=html.replace(
/(\s(?:src|href|poster|background)\s*=\s*)(["'])(.*?)\2/gi,
function(
match,
prefix,
quote,
value
){

return(
prefix+
quote+
replaceURL(value)+
quote
);

}
);


html=html.replace(
/url\(\s*(["']?)(.*?)\1\s*\)/gi,
function(
match,
quote,
value
){

return(
"url("+
quote+
replaceURL(value)+
quote+
")"
);

}
);


html=html.replace(
/<base[^>]*>/gi,
""
);


if(
!/<meta[^>]+charset=/i.test(html)
){

html=
"<meta charset=\"UTF-8\">"+
html;

}

return html;

}


/* =========================
   リソースマップ
========================= */

function addResourceMapping(
map,
key,
value
){

if(!key){
return;
}

const normalized=
normalizeURL(key);

map.set(key,value);
map.set(normalized,value);

try{

const decoded=
decodeURIComponent(key);

map.set(decoded,value);
map.set(
normalizeURL(decoded),
value
);

}catch{}

}


function lookupResource(
map,
key
){

if(map.has(key)){
return map.get(key);
}

const normalized=
normalizeURL(key);

if(map.has(normalized)){
return map.get(normalized);
}

try{

const decoded=
decodeURIComponent(key);

if(map.has(decoded)){
return map.get(decoded);
}

const decodedNormalized=
normalizeURL(decoded);

if(
map.has(decodedNormalized)
){

return map.get(
decodedNormalized
);

}

}catch{}

return null;

}


function normalizeURL(url){

return String(url)
.trim()
.replace(
/^["']|["']$/g,
""
)
.replace(
/&amp;/gi,
"&"
);

}


/* =========================
   MIME解析
========================= */

function parseMHTML(buffer){

const bytes=new Uint8Array(buffer);

const headerEnd=
findHeaderEnd(bytes);

if(headerEnd<0){

throw new Error(
"MHTMLのヘッダーを確認できませんでした"
);

}

const header=
decodeBytes(
bytes.slice(0,headerEnd),
"utf-8"
);

const boundaryMatch=
header.match(
/boundary\s*=\s*(?:"([^"]+)"|'([^']+)'|([^\s;]+))/i
);

if(!boundaryMatch){

throw new Error(
"MHTMLのboundaryが見つかりませんでした"
);

}

const boundary=
boundaryMatch[1]||
boundaryMatch[2]||
boundaryMatch[3];

const bodyStart=
headerEnd+
getHeaderSeparatorLength(
bytes,
headerEnd
);

const parts=
splitMultipart(
bytes.slice(bodyStart),
boundary
);

const resources=[];
const pages=[];

for(
const part of parts
){

if(
!part||
part.length===0
){
continue;
}

const pHeaderEnd=
findHeaderEnd(part);

if(pHeaderEnd<0){
continue;
}

const pHeader=
decodeBytes(
part.slice(0,pHeaderEnd),
"utf-8"
);

const pBodyStart=
pHeaderEnd+
getHeaderSeparatorLength(
part,
pHeaderEnd
);

const encodedBody=
part.slice(pBodyStart);

const headers=
parseHeaders(pHeader);

const contentType=
getHeader(
headers,
"content-type"
)||"";

const transfer=
(
getHeader(
headers,
"content-transfer-encoding"
)||""
)
.trim()
.toLowerCase();

const location=
getHeader(
headers,
"content-location"
)||"";

const contentId=
cleanContentId(
getHeader(
headers,
"content-id"
)||""
);

const data=
decodeTransferEncoding(
encodedBody,
transfer
);

const charset=
getCharset(contentType)||
"utf-8";

if(
contentType
.toLowerCase()
.includes("text/html")
){

const html=
decodeBytes(
data,
charset
);

pages.push({
html:html,
location:location,
contentId:contentId,
index:pages.length
});

}

resources.push({
contentType:contentType,
location:location,
contentId:contentId,
data:data
});

}

return{
pages:pages,
resources:resources
};

}


/* =========================
   Multipart
========================= */

function findHeaderEnd(bytes){

for(
let i=0;
i<bytes.length-3;
i++
){

if(
bytes[i]===13&&
bytes[i+1]===10&&
bytes[i+2]===13&&
bytes[i+3]===10
){

return i;

}

}

for(
let i=0;
i<bytes.length-1;
i++
){

if(
bytes[i]===10&&
bytes[i+1]===10
){

return i;

}

}

return -1;

}


function getHeaderSeparatorLength(
bytes,
pos
){

if(
bytes[pos]===13&&
bytes[pos+1]===10&&
bytes[pos+2]===13&&
bytes[pos+3]===10
){

return 4;

}

return 2;

}


function splitMultipart(
bytes,
boundary
){

const marker=
new TextEncoder().encode(
"--"+boundary
);

const parts=[];
const positions=[];

let start=0;

while(true){

const pos=
indexOfBytes(
bytes,
marker,
start
);

if(pos<0){
break;
}

positions.push(pos);

start=
pos+
marker.length;

}

for(
let i=1;
i<positions.length;
i++
){

const partStart=
positions[i-1]+marker.length;

const partEnd=
positions[i];

let s=partStart;

if(
bytes[s]===13&&
bytes[s+1]===10
){

s+=2;

}else if(
bytes[s]===10
){

s+=1;

}

let e=partEnd;

if(
e>=2&&
bytes[e-2]===13&&
bytes[e-1]===10
){

e-=2;

}else if(
e>=1&&
bytes[e-1]===10
){

e-=1;

}

if(e>s){

parts.push(
bytes.slice(s,e)
);

}

}

return parts;

}


function indexOfBytes(
source,
target,
start
){

outer:
for(
let i=start;
i<=source.length-target.length;
i++
){

for(
let j=0;
j<target.length;
j++
){

if(
source[i+j]!==target[j]
){

continue outer;

}

}

return i;

}

return -1;

}


/* =========================
   ヘッダー
========================= */

function parseHeaders(text){

text=
text
.replace(
/\r\n[ \t]+/g,
" "
)
.replace(
/\n[ \t]+/g,
" "
);

const headers={};

for(
const line of
text.split(/\r?\n/)
){

const index=
line.indexOf(":");

if(index<0){
continue;
}

const name=
line
.slice(0,index)
.trim()
.toLowerCase();

const value=
line
.slice(index+1)
.trim();

if(headers[name]){

headers[name]+=", "+value;

}else{

headers[name]=value;

}

}

return headers;

}


function getHeader(
headers,
name
){

return headers[
name.toLowerCase()
]||"";

}


function getCharset(
contentType
){

const match=
contentType.match(
/charset\s*=\s*(?:"([^"]+)"|([^;\s]+))/i
);

return match?
(
match[1]||
match[2]
).trim():
"utf-8";

}


function cleanContentId(id){

return id
.replace(
/^<|>$/g,
""
)
.trim();

}


/* =========================
   エンコード
========================= */

function decodeTransferEncoding(
bytes,
encoding
){

if(
encoding.includes("base64")
){

return decodeBase64Bytes(bytes);

}

if(
encoding.includes("quoted-printable")||
encoding.includes("quopri")
){

return decodeQuotedPrintable(bytes);

}

return bytes;

}


function decodeBase64Bytes(bytes){

let text="";

for(
let i=0;
i<bytes.length;
i++
){

const c=bytes[i];

if(
c===9||
c===10||
c===13||
c===32
){

continue;

}

text+=String.fromCharCode(c);

}

try{

const binary=atob(text);

const result=
new Uint8Array(
binary.length
);

for(
let i=0;
i<binary.length;
i++
){

result[i]=
binary.charCodeAt(i);

}

return result;

}catch{

return new Uint8Array();

}

}


function decodeQuotedPrintable(bytes){

const output=[];

const text=
new TextDecoder(
"latin1"
).decode(bytes);

for(
let i=0;
i<text.length;
i++
){

if(text[i]==="="){

if(
text[i+1]==="\r"&&
text[i+2]==="\n"
){

i+=2;
continue;

}

if(
text[i+1]==="\n"
){

i+=1;
continue;

}

const hex=
text.slice(
i+1,
i+3
);

if(
/^[0-9A-Fa-f]{2}$/.test(hex)
){

output.push(
parseInt(hex,16)
);

i+=2;

continue;

}

}

output.push(
text.charCodeAt(i)&255
);

}

return new Uint8Array(output);

}


function decodeBytes(bytes,charset){

charset=
(
charset||
"utf-8"
)
.toLowerCase()
.replace(
/["']/g,
""
)
.trim();

const aliases={
utf8:"utf-8",
utf_8:"utf-8",
shift_jis:"shift-jis",
sjis:"shift-jis",
"x-sjis":"shift-jis",
"iso-2022-jp":"iso-2022-jp",
"euc-jp":"euc-jp",
"us-ascii":"windows-1252"
};

charset=
aliases[charset]||
charset;

try{

return new TextDecoder(
charset
).decode(bytes);

}catch{

try{

return new TextDecoder(
"utf-8"
).decode(bytes);

}catch{

let result="";

for(
let i=0;
i<bytes.length;
i++
){

result+=String.fromCharCode(
bytes[i]
);

}

return result;

}

}

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
